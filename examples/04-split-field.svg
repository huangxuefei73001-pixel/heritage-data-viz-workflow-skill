<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
<title id="title">Split-field poster grammar sample</title>
<desc id="desc">A deterministic sample showing a title and provenance field paired with a dense partial radial evidence visual.</desc>
<rect width="1400" height="900" fill="#151719"/>
<style>.sans{font-family:Arial,'Helvetica Neue',sans-serif}.serif{font-family:Georgia,'Times New Roman',serif}.muted{fill:#A7AAA7}.paper{fill:#F3EFE6}.rule{stroke:#6B6E6B;stroke-width:1}.accent{stroke:#D8C94D;fill:none}</style>
<line x1="70" y1="75" x2="1330" y2="75" class="rule"/>
<text x="70" y="125" class="sans" font-size="22" font-weight="700" fill="#F3EFE6" letter-spacing="2">HERITAGE DATA VIZ WORKFLOW · SAMPLE 04</text>
<text x="70" y="230" class="serif" font-size="72" fill="#F3EFE6">One field for context.</text>
<text x="70" y="305" class="serif" font-size="72" fill="#F3EFE6">One field for evidence.</text>
<text x="70" y="365" class="sans" font-size="30" fill="#C8CAC8">标题、入口与来源保持清晰；复杂关系交给主视觉。</text>
<rect x="70" y="465" width="410" height="250" fill="#222528" stroke="#686C69"/>
<text x="100" y="515" class="sans" font-size="18" font-weight="700" fill="#D8C94D" letter-spacing="1.5">CONTEXT / 项目信息</text>
<text x="100" y="570" class="sans" font-size="26" fill="#F3EFE6">13 years · 11 sessions</text>
<text x="100" y="615" class="sans" font-size="22" fill="#A7AAA7">Source / date range / access</text>
<line x1="100" y1="655" x2="445" y2="655" class="rule"/>
<text x="100" y="692" class="sans" font-size="18" fill="#A7AAA7">QR or public link only when verified.</text>
<g transform="translate(990 470)">
<circle r="250" fill="none" stroke="#3B3E40" stroke-width="34"/>
<circle r="205" fill="none" stroke="#2B6680" stroke-width="26" stroke-dasharray="155 42 95 26 120 36"/>
<circle r="165" fill="none" stroke="#8B4A3A" stroke-width="20" stroke-dasharray="78 28 140 18 60 35"/>
<circle r="128" fill="none" stroke="#6E8A57" stroke-width="16" stroke-dasharray="112 34 54 20 90 30"/>
<line x1="0" y1="-265" x2="0" y2="-310" stroke="#D8C94D" stroke-width="3"/>
<text x="0" y="12" class="serif" font-size="56" fill="#F3EFE6" text-anchor="middle">EVIDENCE</text>
<text x="0" y="53" class="sans" font-size="18" fill="#A7AAA7" text-anchor="middle">partial radial / dense chronology</text>
</g>
<line x1="70" y1="825" x2="1330" y2="825" class="rule"/>
<text x="70" y="860" class="sans" font-size="18" fill="#A7AAA7">SPLIT FIELD · CONTEXT + DOMINANT EVIDENCE</text>
</svg>